[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "news-trace-backend"
version = "0.1.0"
description = "News Trace gateway, MCP fixture server, and chronological projection"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.0",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
